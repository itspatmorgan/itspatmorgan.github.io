name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.31.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: node --test scripts/studio-deployment.test.mjs
      - run: pnpm build

      - name: Select the latest passing Design Studio source
        id: studio
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const selectSource = require('./scripts/select-studio-source.cjs');
            await selectSource({ github, core });
      - name: Checkout Design Studio at the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.studio.outputs.repository }}
          ref: ${{ steps.studio.outputs.sha }}
          path: studio-source
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          working_directory: studio-source
      - name: Install Studio dependencies
        working-directory: studio-source
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Build the demo for its public path
        working-directory: studio-source
        env:
          STUDIO_BASE_PATH: /design-studio-demo/
        run: |
          mise exec -- pnpm build
          mise exec -- pnpm build:inspect
      - name: Include the demo in the website output
        run: node scripts/include-studio-demo.mjs studio-source/dist
      - name: Upload the combined website and demo
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
